description = "Ubuntu SAUCE: AppArmor restriction of unprivileged user namespaces (kernel.apparmor_restrict_unprivileged_userns). Unconfined tasks creating a userns are moved to the unprivileged_userns profile (no capabilities); profiles with `userns,` (chrome, code, slack, ...) keep working. Pairs with Ubuntu's /usr/lib/sysctl.d/10-apparmor.conf. Ported from Ubuntu-7.0.0-38.38 (resolute) apparmor5.0.0 [9-13,17,18,49/57]."
kind = "out-of-tree"
min_version = "7.3-rc6"

# Match Ubuntu: default-on restriction denies userns before apparmor.service
# loads the unprivileged_userns profile (LP#1990064). The sysctl turns it on.
[config]
SECURITY_APPARMOR_RESTRICT_USERNS = "n"

