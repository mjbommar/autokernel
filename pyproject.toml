[project]
name = "autokernel"
version = "0.7.0"
description = "LLM-assisted minimal Linux kernel builder. Multi-distro: Debian/Ubuntu, Fedora/RHEL, Arch, openSUSE, Gentoo, Alpine."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Michael Bommarito", email = "michael.bommarito@gmail.com" },
]
keywords = ["linux", "kernel", "build", "config", "llm", "ai", "claude", "openai", "gentoo", "debian", "fedora", "arch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Operating System Kernels :: Linux",
]
dependencies = [
    "kconfiglib>=14.1.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=1.92.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "textual>=0.80",
    "typer>=0.25.1",
]

[project.urls]
Homepage = "https://github.com/mjbommar/autokernel"
Issues = "https://github.com/mjbommar/autokernel/issues"
Repository = "https://github.com/mjbommar/autokernel"

[project.scripts]
autokernel = "autokernel:main"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
