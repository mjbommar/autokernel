[project]
name = "autokernel"
version = "0.15.0"
description = "LLM-assisted Linux kernel config optimizer, validator, and distro-native package builder."
readme = "README.md"
requires-python = ">=3.12,<4"
license = "MIT"
authors = [
    { name = "Michael Bommarito", email = "michael.bommarito@gmail.com" },
]
maintainers = [
    { name = "Michael Bommarito", email = "michael.bommarito@gmail.com" },
]
keywords = [
    "linux",
    "kernel",
    "kconfig",
    "kernel-build",
    "kernel-config",
    "llm",
    "qemu",
    "sysadmin",
    "debian",
    "fedora",
    "arch",
    "opensuse",
    "gentoo",
    "alpine",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Operating System Kernels :: Linux",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "kconfiglib>=14.1.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=1.92.0",
    "python-debian>=0.1.49",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "textual>=0.80",
    "typer>=0.25.1",
]

[project.urls]
Documentation = "https://github.com/mjbommar/autokernel/tree/master/docs"
Homepage = "https://github.com/mjbommar/autokernel"
Issues = "https://github.com/mjbommar/autokernel/issues"
Repository = "https://github.com/mjbommar/autokernel"

[project.scripts]
autokernel = "autokernel:main"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Boot-time research harnesses are deliberately terse (semicolons, compact
# one-liners, single-line imports) so the measurement logic reads as a dense
# script, not production code. Keep real checks (F-class, E9) enforced; allow
# the intentional style. See scripts/boottime/README.md.
"scripts/boottime/*.py" = ["E401", "E701", "E702", "E731"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    # autokernel is intentionally subprocess-heavy: build, package-manager,
    # QEMU, and distro probing commands are all executed with shell=False.
    "B404",
    "B603",
    "B607",
    # False positives: Severity.PASS and /tmp disk-space probing.
    "B105",
    "B108",
]

[tool.vulture]
paths = ["src"]
min_confidence = 80
exclude = [".venv", "build", "dist"]
