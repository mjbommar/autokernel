name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest
        env:
          # The agent module imports happen during collection; ensure no
          # network calls fire by leaving these unset (pydantic-ai only
          # contacts providers when an Agent is actually invoked, which
          # the tests don't do).
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: uv run pytest -v --tb=short

  shellcheck:
    name: shellcheck (collect.sh + install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck -S warning scripts/collect.sh scripts/validate-docker.sh scripts/validate-qemu.sh install.sh
